# Default settings. A config file only needs the values it changes.
detector:
  weights: models/best.pt
  confidence: 0.4      # discard weaker detections
  image_size: 640
  device: null         # null chooses automatically; or "cpu", "0"
  iou: 0.7             # boxes overlapping more than this are merged into the stronger one
  augment: false       # test-time augmentation: also detect on flipped and rescaled copies, ~3x slower

ocr:
  engine: hybrid       # "plate": a small model trained on number plates, best on small or
                       # blurred plates; "easyocr": a general text reader, better on
                       # two-line plates; "hybrid": the plate model first, and EasyOCR
                       # when it is unsure
  plate_model: cct-xs-v2-global-model  # a fast-plate-ocr model, downloaded on first use
  fallback_confidence: 0.7  # hybrid: plate model readings below this go to EasyOCR
  languages: [en]      # EasyOCR only
  gpu: true            # EasyOCR only; falls back to CPU when no GPU is available
  min_confidence: 0.2  # ignore OCR fragments below this
  every_n_frames: 1    # read every frame until a plate is settled; OCR is the slowest stage,
                       # but a single frame is often misread, so more readings vote
  crop_padding: 0.05   # share of the box added on each side; more padding read worse
  min_crop_height: 128 # smaller crops are upscaled for EasyOCR, and for the plate model when a
                       # preprocess filter is on; 128 read better than 64
  # EasyOCR readtext settings. These are EasyOCR's own defaults.
  decoder: greedy      # or beamsearch, which weighs several candidate readings; slower
  beam_width: 5        # candidates kept by beamsearch
  text_threshold: 0.7  # how sure the text finder must be that a region is text
  low_text: 0.4        # lower includes fainter character edges
  link_threshold: 0.4  # lower joins characters into one word more readily
  contrast_ths: 0.1    # text read with less confidence than this is read again with more contrast
  adjust_contrast: 0.5 # contrast used for that second reading
  mag_ratio: 1.0       # enlarges the image inside the text finder; above 1 helps small text
  min_size: 20         # text regions smaller than this, in pixels, are ignored
  rotation_info: []    # also read the text turned by these angles: any of 90, 180, 270

preprocess:            # OpenCV filters for each plate crop, applied in this order by both readers
  grayscale: true      # EasyOCR only: the plate model is given colour. Thresholding is always gray
  denoise: none        # none, bilateral (keeps edges) or median (removes speckles)
  gamma: 1.0           # above 1 brightens dark plates, below 1 darkens washed-out ones
  contrast: none       # none, clahe (evens out shadows and glare) or equalize
  clahe_clip_limit: 2.0
  sharpen: 0.0         # unsharp mask strength, 0 to 5; 0 is off
  threshold: none      # none, otsu or adaptive: turns the plate black and white
  adaptive_block_size: 31  # odd; should be larger than a character's stroke width
  invert: false        # for light text on dark plates

tracker:
  max_age: 5           # frames a plate may go undetected before its track ends;
                       # keep this low, or a track can coast onto the next vehicle
  min_hits: 2          # detections required to confirm a track
  iou_threshold: 0.2

consensus:
  min_agreement: 3     # identical readings needed to report early, and to mark a plate confirmed
  min_votes_on_close: 1  # readings needed to report when a track ends; fewer than
                         # min_agreement are reported as unconfirmed
  dedupe_window_seconds: 30  # tracks with near-identical plates this close in time are one vehicle
  recheck_every_n_frames: 16  # how often a settled track is read again
  report_delay_seconds: 3.0  # report a vehicle once nothing has joined it for this long

output:
  directory: output
  save_crops: true
  save_annotated_video: false

source:
  max_read_failures: 30  # reconnect attempts for cameras and streams
  retry_delay_seconds: 1.0

logging:
  level: INFO
  format: text         # "json" for log aggregation
