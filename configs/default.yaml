# Default settings. A config file only needs the values it changes.
detector:
  weights: models/best.pt
  confidence: 0.4      # discard weaker detections
  image_size: 640
  device: null         # null chooses automatically; or "cpu", "0"

ocr:
  engine: hybrid       # "plate": a small model trained on number plates, best on small or
                       # blurred plates; "easyocr": a general text reader, better on
                       # two-line plates; "hybrid": the plate model first, and EasyOCR
                       # when it is unsure
  plate_model: cct-xs-v2-global-model  # a fast-plate-ocr model, downloaded on first use
  fallback_confidence: 0.7  # hybrid: plate model readings below this go to EasyOCR
  languages: [en]      # EasyOCR only
  gpu: true            # EasyOCR only; falls back to CPU when no GPU is available
  min_confidence: 0.2  # ignore OCR fragments below this
  every_n_frames: 1    # read every frame until a plate is settled; OCR is the slowest stage,
                       # but a single frame is often misread, so more readings vote
  crop_padding: 0.05   # share of the box added on each side; more padding read worse
  min_crop_height: 128 # EasyOCR only: smaller crops are upscaled; 128 read better than 64

tracker:
  max_age: 5           # frames a plate may go undetected before its track ends;
                       # keep this low, or a track can coast onto the next vehicle
  min_hits: 2          # detections required to confirm a track
  iou_threshold: 0.2

consensus:
  min_agreement: 3     # identical readings needed to report early, and to mark a plate confirmed
  min_votes_on_close: 1  # readings needed to report when a track ends; fewer than
                         # min_agreement are reported as unconfirmed
  dedupe_window_seconds: 30  # tracks with near-identical plates this close in time are one vehicle
  recheck_every_n_frames: 16  # how often a settled track is read again
  report_delay_seconds: 3.0  # report a vehicle once nothing has joined it for this long

output:
  directory: output
  save_crops: true
  save_annotated_video: false

source:
  max_read_failures: 30  # reconnect attempts for cameras and streams
  retry_delay_seconds: 1.0

logging:
  level: INFO
  format: text         # "json" for log aggregation
