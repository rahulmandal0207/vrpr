[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vrpr"
description = "Vehicle registration plate recognition for video streams"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rahul Mandal" }]
dynamic = ["version"]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    # 8.3.41, .42, .45 and .46 were compromised releases; the floor excludes them.
    "ultralytics>=8.3.50,<9",
    "easyocr>=1.7.2,<2",
]
dataset = ["roboflow>=1.1"]
web = ["streamlit>=1.40,<2"]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
vrpr = "vrpr.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vrpr.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -m 'not integration'"
markers = ["integration: needs the real ML stack and downloaded models"]

[tool.coverage.run]
source = ["vrpr"]
branch = true
# Streamlit's AppTest runs the page script in a way coverage cannot trace. tests/test_web.py
# drives it end to end, and the logic it calls lives in vrpr.web.runs, which is measured.
omit = ["*/vrpr/web/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["\\.\\.\\.$", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "S"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "easyocr.*", "roboflow.*", "torch", "torch.*"]
ignore_missing_imports = true
